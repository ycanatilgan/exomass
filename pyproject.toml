[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exomass"
version = "1.0.0"
description = "Mass inference for exoplanets from catalogue observables"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yigit Can Atilgan" }]
keywords = ["exoplanets", "mass-radius", "machine-learning", "astronomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# The shipped models are LightGBM text files, which load in any LightGBM 4.x.
# Within 4.x the same file gives the same prediction; the bound stops a future
# major version from changing that silently.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "lightgbm>=4.0,<5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ycanatilgan/exomass"
Repository = "https://github.com/ycanatilgan/exomass"

[project.scripts]
exomass = "exomass.cli:main"

[tool.setuptools.packages.find]
include = ["exomass*"]

[tool.setuptools.package-data]
exomass = ["models/*.json", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
